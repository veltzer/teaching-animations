# Final mp4s land directly in _site/animations/, named via -o on the
# render command line. Intermediate junk (Tex, text rasters, partial
# movie chunks, logs) goes under media_dir: .manim_scratch, gitignored and
# never published, when manim is run by hand, and a temporary directory
# (--media_dir) when scripts/build_animation.py renders for the build, so
# the build writes only its declared mp4s. manim reads this file from the
# repo root.
[CLI]
media_dir = .manim_scratch
video_dir = _site/animations
sections_dir = {media_dir}/sections
images_dir = {media_dir}/images
text_dir = {media_dir}/texts
tex_dir = {media_dir}/tex
log_dir = {media_dir}/logs
partial_movie_dir = {media_dir}/partial/{scene_name}
