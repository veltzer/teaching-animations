[dependencies]
system = [
	# manim renders mp4 with ffmpeg
	"ffmpeg",
	# manim-voiceover uses sox to compute audio durations
	"sox",
	# manim's text and vector rendering backend
	"libcairo2-dev",
	"libpango1.0-dev",
	"pkg-config",
	# required for manim's Tex(...) and MathTex(...) mobjects
	"texlive-latex-base",
	"texlive-fonts-recommended",
	"texlive-latex-extra",
]

[processor.generator.manim]
command = "scripts/build_animation.py"
src_dirs = ["animations"]
src_extensions = [".py"]
output_dir = "_site/animations"
output_extension = "mp4"
batch = true
dep_inputs = ["manim.cfg"]

[processor.ruff]
src_dirs = ["scripts", "animations"]

# Design-token rules (biome GritQL plugin) from the shared-themes submodule:
# stylesheets must use its var(--<role>) tokens instead of raw colors.
[processor.biome]
src_dirs = ["resources"]
src_extensions = [".css"]
args = ["--config-path", "shared/shared-themes/biome-tokens.jsonc"]
dep_inputs = ["shared/shared-themes/biome-tokens.jsonc", "shared/shared-themes/design-tokens.grit"]

[processor.explicit.build_site]
command = "scripts/build_site.py"
inputs = [
    "resources/index_material_web.html",
    "resources/index_material_web.css",
    "resources/index_material_web.js",
    "resources/index_material_css.html",
    "resources/index_material_css.css",
    "resources/index_material_css.js",
    "shared/shared-themes/themes.css",
    "shared/shared-themes/base.css",
    "shared/shared-themes/typography.css",
    "shared/shared-themes/components.css",
    "shared/shared-themes/theme-switcher.js",
]
input_globs = [
    "_site/animations/*.mp4",
    "animations/*.py",
]
output_dirs = ["_site"]

[analyzer.python]

[pages]
dir = "_site"

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["doc"]
src_files = ["README.md"]

# ─── html ────────────────────────────────────────────────────────────────────

[processor.tidy]
src_dirs = ["resources"]
# The index pages use Material Web components (<md-outlined-select>, ...),
# which are valid HTML5 custom elements tidy only accepts with custom-tags,
# and a CSS-drawn toggle built from an empty <span>, which is valid HTML that
# tidy would otherwise warn it might trim.
args = ["--custom-tags", "blocklevel", "--drop-empty-elements", "no"]

# ─── javascript ──────────────────────────────────────────────────────────────

[processor.oxlint]
src_dirs = ["resources"]
args = ["-c", ".oxlintrc.json"]
