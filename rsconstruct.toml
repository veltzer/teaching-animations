[dependencies]
system = [
	# manim renders mp4 with ffmpeg
	"ffmpeg",
	# manim-voiceover uses sox to compute audio durations
	"sox",
	# manim's text and vector rendering backend
	"libcairo2-dev",
	"libpango1.0-dev",
	"pkg-config",
	# required for manim's Tex(...) and MathTex(...) mobjects
	"texlive-latex-base",
	"texlive-fonts-recommended",
	"texlive-latex-extra",
]
pip = [
	# manim-voiceover does `import pkg_resources` at module top level, which
	# lives in setuptools. setuptools is no longer bundled on Python 3.12+,
	# so we install it explicitly here so `rsconstruct tools install-deps`
	# puts it in place before any `manim` invocation.
	"setuptools<82",
	# scripts/build_animation.py invokes `manim` as a subprocess, so the
	# static AST analyzer can't see the dependency. Declare them explicitly
	# so they land on the runner's $PATH / site-packages.
	"manim",
	"manim_voiceover",
  "manim-voiceover[gtts]",
]

[processor.generator.manim]
command = "scripts/build_animation.py"
src_dirs = ["animations"]
src_extensions = [".py"]
output_dir = "_site/animations"
output_extension = "mp4"
batch = true
dep_inputs = ["manim.cfg"]

[processor.ruff]
src_dirs = ["scripts", "animations"]

[processor.stylelint]
src_dirs = ["resources"]

[processor.explicit.build_site]
command = "scripts/build_site.py"
inputs = [
    "resources/index_material_web.html",
    "resources/index_material_web.css",
    "resources/index_material_web.js",
    "resources/index_material_css.html",
    "resources/index_material_css.css",
    "resources/index_material_css.js",
    "shared/shared-themes/themes.css",
    "shared/shared-themes/base.css",
    "shared/shared-themes/typography.css",
    "shared/shared-themes/components.css",
    "shared/shared-themes/theme-switcher.js",
]
input_globs = [
    "_site/animations/*.mp4",
    "animations/*.py",
]
output_dirs = ["_site"]

[processor.requirements]
src_dirs = ["scripts", "animations"]
# manim-voiceover does `import pkg_resources` at module top level, which
# lives in setuptools. setuptools is no longer bundled on Python 3.12+,
# and manim-voiceover's metadata does not declare it. Static AST scanning
# can't see that, so we list it here.
extra = ["setuptools"]
# Modules in shared/shared-themes/ are imported by animations and scripts
# because that directory is added to sys.path at runtime. Declare it as a
# Python source root so the requirements generator doesn't classify
# `manim_themes` (which lives at shared/shared-themes/manim_themes.py) as
# a PyPI distribution.
python_paths = ["shared/shared-themes"]

[analyzer.python]
