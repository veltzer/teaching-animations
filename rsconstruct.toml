[dependencies]
system = [
	# manim-voiceover uses sox to compute audio durations
	"sox",
	# manim's text and vector rendering backend
	"libcairo2-dev",
	"libpango1.0-dev",
	"pkg-config",
	# required for manim's Tex(...) and MathTex(...) mobjects
	"texlive-latex-base",
	"texlive-fonts-recommended",
	"texlive-latex-extra",
]

[processor.generator.generic.manim]
command = "scripts/build_animation.py"
src_dirs = ["animations"]
src_extensions = [".py"]
output_dir = "_site/animations"
output_extension = "mp4"
batch = true
dep_inputs = ["manim.cfg"]
# manim renders mp4 with ffmpeg, installed into the project at the release
# rsconstruct.lock pins
required_tools = ["ffmpeg"]
# The voiceovers are synthesized by gTTS, which calls Google's speech service.
sandbox_network = true

[processor.checker.ruff]
src_dirs = ["scripts", "animations"]

# Design-token rules (biome GritQL plugin) from the shared-themes submodule:
# stylesheets must use its var(--<role>) tokens instead of raw colors.
[processor.checker.biome]
src_dirs = ["resources"]
src_extensions = [".css"]
args = ["--config-path", "shared/shared-themes/biome-tokens.jsonc"]
dep_inputs = ["shared/shared-themes/biome-tokens.jsonc", "shared/shared-themes/design-tokens.grit"]

[processor.explicit.generic.build_site]
command = "scripts/build_site.py"
inputs = [
    "resources/index_material_web.html",
    "resources/index_material_web.css",
    "resources/index_material_web.js",
    "resources/index_material_css.html",
    "resources/index_material_css.css",
    "resources/index_material_css.js",
    "shared/shared-themes/themes.css",
    "shared/shared-themes/base.css",
    "shared/shared-themes/typography.css",
    "shared/shared-themes/components.css",
    "shared/shared-themes/theme-switcher.js",
    "shared/shared-themes/themes.json",
    "shared/shared-themes/fonts.css",
    "shared/shared-themes/shared_themes.py",
]
input_globs = [
    "shared/shared-themes/fonts/*",
    "_site/animations/*.mp4",
    "animations/*.py",
]
output_dirs = ["_site"]

[analyzer.python]

[pages]
dir = "_site"

# lint the Lua configuration with luacheck (policy: .luacheckrc)
[processor.checker.iluacheck]
src_dirs = ["config"]

# lint the YAML files with yamllint (policy: .yamllint.yaml)
[processor.checker.iyamllint]
src_dirs = [".github"]
src_files = [".yamllint.yaml"]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# audit the GitHub Actions workflow files for security problems with zizmor
# (policy: .github/zizmor.yml)
[processor.checker.zizmor]
src_dirs = [".github/workflows"]
# The pedantic persona: also the findings zizmor's default persona keeps
# quiet (undocumented permissions, template expansion of any context,
# unnamed jobs, ...). --offline and --no-progress are the default args.
args = ["--offline", "--no-progress", "--persona=pedantic"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_dirs = ["doc"]
src_files = ["README.md"]

# ─── html ────────────────────────────────────────────────────────────────────

[processor.checker.itidy]
src_dirs = ["resources"]
# The index pages use Material Web components (<md-outlined-select>, ...),
# which are valid HTML5 custom elements tidy only accepts with custom-tags.
options = ["custom-tags: blocklevel"]

# ─── javascript ──────────────────────────────────────────────────────────────

[processor.checker.oxlint]
src_dirs = ["resources"]
args = ["-c", ".oxlintrc.repo.json"]
dep_inputs = [".oxlintrc.repo.json"]
