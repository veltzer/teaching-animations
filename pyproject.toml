[project]
name = "teaching-animations"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "manim",
    # The [gtts] extras entry covers the base package too; do not also list
    # a bare manim-voiceover — install-deps dedupes by distribution name and
    # a bare entry appearing first would shadow this one, dropping the extras.
    "manim-voiceover[gtts]",
]

[dependency-groups]
dev = [
    "pyrefly",
    "pytest",
    "ruff",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor), with pyrefly's default
# error set. "." on the search path is mypy's implicit current directory.
# Warnings fail the check like errors (pyrefly lets them pass by default).
min-severity = "warn"
search-path = [
    "scripts",
    "animations",
    # manim_themes, which the animations import, lives in the submodule
    "shared/shared-themes",
    ".",
]

[tool.pyrefly.errors]
no-any-return = "error"
