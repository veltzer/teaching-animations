# Generated to let `uv sync` install this repo's Python dependencies.
# The authoritative dependency list is [dependencies].pip in
# rsconstruct.toml; keep the two in sync when editing.

[project]
name = "teaching-animations"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "setuptools<82",
    "manim",
    # The [gtts] extras entry covers the base package too; do not also list
    # a bare manim-voiceover — install-deps dedupes by distribution name and
    # a bare entry appearing first would shadow this one, dropping the extras.
    "manim-voiceover[gtts]",
]

[dependency-groups]
dev = [
    "mypy",
    "pylint",
    "pytest",
    "ruff",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false
